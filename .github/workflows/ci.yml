name: CI

# Only run the test matrix when something that affects the tests changed:
# package source, the package manifest/compat, the test suite (including the
# Go test server under test/go), or this workflow itself. Docs, README, and
# utils changes skip CI.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/ci.yml'

env:
  GRPC_TEST_SERVER_HOST: "localhost"
  GRPC_TEST_SERVER_PORT: 8001 

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # '1.10' is the compat floor in Project.toml (and the current LTS), so it
        # stays pinned explicitly. '1' tracks the latest stable release. Nightly
        # runs in nightly.yml so it never gates PRs or affects the CI badge.
        version:
          - '1.10'
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: aarch64
          # Cover the previous macOS release once, on the latest Julia only.
          - os: macos-15
            version: '1'
            arch: aarch64
    steps:
    - uses: actions/checkout@v5
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build Go gRPC Test Server
      run: go build -o grpc_test_server .
      working-directory: test/go
    - name: Rename Go executable for windows
      if: matrix.os == 'windows-latest'
      run: mv grpc_test_server grpc_test_server.exe
      shell: pwsh
      working-directory: test/go
    - uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.version }}
        arch: ${{ matrix.arch }}
    - uses: julia-actions/cache@v2
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-runtest@v1
      timeout-minutes: 15
      env: 
        JULIA_GRPCCLIENT_TEST_START_SERVER: "go"
    - uses: julia-actions/julia-processcoverage@v1
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: JuliaIO/gRPCClient.jl
