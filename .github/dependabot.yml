version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/utils/gRPCClientUtils.jl"
    schedule:
      interval: "weekly"
    groups:
      all-julia-packages:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/test/go"
    schedule:
      interval: "weekly"
    groups:
      all-go-modules:
        patterns:
          - "*"
